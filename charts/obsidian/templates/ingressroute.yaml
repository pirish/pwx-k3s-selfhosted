{{- if .Values.ingressRoute.enabled -}}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "obsidian.fullname" . }}-ingressroute
  labels:
    {{- include "obsidian.labels" . | nindent 4 }}
  {{- with .Values.ingressRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: Host(`{{ .Values.ingressRoute.host }}`)
      kind: Rule
      services:
        - name: {{ include "obsidian.fullname" . }}-service
          port: {{ .Values.service.port }}
  {{- if .Values.ingressRoute.tls.enabled }}
  tls:
    secretName: {{ .Values.ingressRoute.tls.secretName }}
  {{- end }}
{{- end }}
{{- if and .Values.service.restApi .Values.service.restApi.enabled .Values.service.restApi.ingressRoute .Values.service.restApi.ingressRoute.enabled -}}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "obsidian.fullname" . }}-rest-api-ingressroute
  labels:
    {{- include "obsidian.labels" . | nindent 4 }}
  {{- with .Values.service.restApi.ingressRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: Host(`{{ .Values.service.restApi.ingressRoute.host }}`)
      kind: Rule
      services:
        - name: {{ include "obsidian.fullname" . }}-service
          port: {{ .Values.service.restApi.port }}
  {{- if .Values.service.restApi.ingressRoute.tls.enabled }}
  tls:
    secretName: {{ .Values.service.restApi.ingressRoute.tls.secretName }}
  {{- end }}
{{- end }}
