# Default values for obsidian.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: lscr.io/linuxserver/obsidian
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: false
  # runAsNonRoot: false
  # runAsUser: 1000
  # seccompProfile:
  #   type: Unconfined # Set to Unconfined if syscall restrictions block Electron

# Service ports configuration
service:
  type: ClusterIP
  # Main HTTPS Web GUI port (port 3001)
  port: 3001
  # Optional HTTP Web GUI port (port 3000)
  httpPort: 3000
  httpEnabled: false
  # Obsidian Local REST API plugin support (port 27124)
  restApi:
    enabled: true
    port: 27124
    ingressRoute:
      enabled: false
      host: obsidian-api.chart-example.local
      annotations: {}
      tls:
        enabled: false
        secretName: chart-example-tls

# GPU and Hardware Acceleration
gpu:
  enabled: false
  # DRI device host path for Intel/AMD EGL/VAAPI rendering & encoding
  driDevice: /dev/dri
  # Nvidia GPU reservation (requires nvidia-ctk runtime and driver 580+)
  nvidia:
    enabled: false
    count: 1

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

ingressRoute:
  enabled: false
  host: chart-example.local
  scheme: https
  annotations: {}
  tls:
    enabled: false
    secretName: chart-example-tls

httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
  - name: gateway
    sectionName: https
  hostnames:
  - chart-example.local
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /

resources: {}
  # limits:
  #   cpu: 2000m
  #   memory: 2Gi
  # requests:
  #   cpu: 500m
  #   memory: 1Gi

# Probes for HTTPS on port 3001
livenessProbe:
  httpGet:
    path: /
    port: https
    scheme: HTTPS
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /
    port: https
    scheme: HTTPS
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

# Persistence for Obsidian configuration, vaults, and plugins
persistence:
  config:
    enabled: true
    storageClass: "local-path"
    accessMode: ReadWriteOnce
    size: 10Gi
    existingClaim: ""

# Shared memory for Electron / Chromium
dshm:
  enabled: true
  sizeLimit: 1Gi

volumes: []
volumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}

# LinuxServer.io Obsidian options
obsidian:
  # User / Group IDs
  puid: 1000
  pgid: 1000
  timezone: "Etc/UTC"
  umask: "" # e.g. "022"

  # Basic HTTP authentication (optional)
  customUser: ""
  password: ""

  # Custom ports / path configuration
  customPort: ""       # CUSTOM_PORT (default: 3000)
  customHttpsPort: ""  # CUSTOM_HTTPS_PORT (default: 3001)
  customWsPort: ""     # CUSTOM_WS_PORT / SELKIES_PORT (default: 8082)
  subfolder: ""        # SUBFOLDER (e.g. "/obsidian/")
  title: "Obsidian"    # TITLE: Browser tab title
  dashboard: ""        # DASHBOARD: selkies-dashboard, selkies-dashboard-zinc, selkies-dashboard-wish
  fileManagerPath: ""  # FILE_MANAGER_PATH: Default upload/download directory

  # Docker-in-Docker / Privileges
  startDocker: ""      # START_DOCKER: set to false to prevent auto-starting DinD if privileged

  # Network & Locale
  disableIpv6: false   # DISABLE_IPV6: set to true to disable IPv6
  lcAll: ""            # LC_ALL: e.g. en_US.UTF-8, zh_CN.UTF-8, ja_JP.UTF-8, fr_FR.UTF-8, de_DE.UTF-8

  # Window & Display
  noDecor: false       # NO_DECOR: run without window borders for PWA
  noFull: false        # NO_FULL: do not automatically fullscreen applications
  noGamepad: false     # NO_GAMEPAD: disable userspace gamepad interposer
  disableZink: false   # DISABLE_ZINK: do not set Zink env vars if GPU detected
  disableDri3: false   # DISABLE_DRI3: disable DRI3 acceleration
  maxRes: ""           # MAX_RES: e.g. "3840x2160", "1920x1080" (default: 16k)
  watermarkPng: ""     # WATERMARK_PNG: full path to watermark png inside container
  watermarkLocation: "" # WATERMARK_LOCATION: 1=TL, 2=TR, 3=BL, 4=BR, 5=Center, 6=Animated

  # Docker Mods and package installs
  dockerMods: ""       # DOCKER_MODS: e.g. "linuxserver/mods:universal-package-install"
  installPackages: ""  # INSTALL_PACKAGES: e.g. "git|curl|libfuse2"

  # Wayland & GPU Acceleration
  pixelfluxWayland: "" # PIXELFLUX_WAYLAND: true (Wayland/Labwc default) or false (fallback to X11)
  selkiesDesktop: ""   # SELKIES_DESKTOP: true/false (initialize panel in Wayland)
  autoGpu: ""          # AUTO_GPU: true/false (automatically use first GPU detected)
  drinode: ""          # DRINODE: Rendering GPU (EGL/3D), e.g. "/dev/dri/renderD128"
  driNode: ""          # DRI_NODE: Encoding GPU (VAAPI/NVENC), e.g. "/dev/dri/renderD128"

  # Hardening & Security lockdown options
  hardening:
    hardenDesktop: false       # HARDEN_DESKTOP: disables open tools, sudo, terminals & locks UI
    hardenOpenbox: false       # HARDEN_OPENBOX: disables close button, mouse menus, keybinds & auto-restarts app
    disableOpenTools: false    # DISABLE_OPEN_TOOLS: disables xdg-open/exo-open
    disableSudo: false         # DISABLE_SUDO: disables sudo and passwordless sudo config
    disableTerminals: false    # DISABLE_TERMINALS: disables common terminal emulators
    disableCloseButton: false  # DISABLE_CLOSE_BUTTON: removes close button from window titlebars
    disableMouseButtons: false # DISABLE_MOUSE_BUTTONS: disables right/middle-click context menus
    hardenKeybinds: false      # HARDEN_KEYBINDS: disables Alt+F4, Alt+Escape, etc.
    restartApp: false          # RESTART_APP: watchdog service that automatically restarts Obsidian if closed

  # Selkies Application Settings (Advanced UI, Audio, Video & Streaming)
  selkies: {}
    # SELKIES_UI_TITLE: "Obsidian"
    # SELKIES_UI_SHOW_LOGO: "true"
    # SELKIES_UI_SHOW_SIDEBAR: "true"
    # SELKIES_UI_SHOW_CORE_BUTTONS: "true"
    # SELKIES_UI_SIDEBAR_SHOW_VIDEO_SETTINGS: "true"
    # SELKIES_UI_SIDEBAR_SHOW_SCREEN_SETTINGS: "true"
    # SELKIES_UI_SIDEBAR_SHOW_AUDIO_SETTINGS: "true"
    # SELKIES_UI_SIDEBAR_SHOW_STATS: "true"
    # SELKIES_UI_SIDEBAR_SHOW_CLIPBOARD: "true"
    # SELKIES_UI_SIDEBAR_SHOW_FILES: "true"
    # SELKIES_UI_SIDEBAR_SHOW_APPS: "true"
    # SELKIES_UI_SIDEBAR_SHOW_SHARING: "true"
    # SELKIES_UI_SIDEBAR_SHOW_GAMEPADS: "true"
    # SELKIES_UI_SIDEBAR_SHOW_FULLSCREEN: "true"
    # SELKIES_UI_SIDEBAR_SHOW_GAMING_MODE: "true"
    # SELKIES_UI_SIDEBAR_SHOW_TRACKPAD: "true"
    # SELKIES_UI_SIDEBAR_SHOW_KEYBOARD_BUTTON: "true"
    # SELKIES_UI_SIDEBAR_SHOW_SOFT_BUTTONS: "true"
    # SELKIES_AUDIO_ENABLED: "true"
    # SELKIES_MICROPHONE_ENABLED: "true"
    # SELKIES_GAMEPAD_ENABLED: "true"
    # SELKIES_CLIPBOARD_ENABLED: "true"
    # SELKIES_COMMAND_ENABLED: "true"
    # SELKIES_FILE_TRANSFERS: "upload,download"
    # SELKIES_ENCODER: "x264enc,x264enc-striped,jpeg"
    # SELKIES_FRAMERATE: "8-120"
    # SELKIES_H264_CRF: "5-50"
    # SELKIES_JPEG_QUALITY: "1-100"
    # SELKIES_H264_FULLCOLOR: "false"
    # SELKIES_H264_STREAMING_MODE: "false"
    # SELKIES_USE_CPU: "false"
    # SELKIES_USE_PAINT_OVER_QUALITY: "true"
    # SELKIES_PAINT_OVER_JPEG_QUALITY: "1-100"
    # SELKIES_H264_PAINTOVER_CRF: "5-50"
    # SELKIES_H264_PAINTOVER_BURST_FRAMES: "1-30"
    # SELKIES_SECOND_SCREEN: "true"
    # SELKIES_AUDIO_BITRATE: "320000"
    # SELKIES_IS_MANUAL_RESOLUTION_MODE: "false"
    # SELKIES_MANUAL_WIDTH: "0"
    # SELKIES_MANUAL_HEIGHT: "0"
    # SELKIES_SCALING_DPI: "96"
    # SELKIES_ENABLE_BINARY_CLIPBOARD: "false"
    # SELKIES_USE_BROWSER_CURSORS: "false"
    # SELKIES_USE_CSS_SCALING: "false"
    # SELKIES_AUDIO_DEVICE_NAME: "output.monitor"
    # SELKIES_DEBUG: "false"
    # SELKIES_ENABLE_SHARING: "true"
    # SELKIES_ENABLE_COLLAB: "true"
    # SELKIES_ENABLE_SHARED: "true"

# Pass arbitrary environment variables or Secret references
extraEnv: {}
envFrom: []
