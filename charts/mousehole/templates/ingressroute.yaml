{{- if and .Values.ingressRoute .Values.ingressRoute.enabled -}}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "mousehole.fullname" . }}-ingressroute
  labels:
    {{- include "mousehole.labels" . | nindent 4 }}
  {{- with .Values.ingressRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: Host(`{{ .Values.ingressRoute.host }}`)
      kind: Rule
      services:
        - name: {{ include "mousehole.fullname" . }}-service
          port: {{ .Values.service.port }}
          {{- if .Values.ingressRoute.scheme }}
          scheme: {{ .Values.ingressRoute.scheme }}
          {{- end }}
  {{- if and .Values.ingressRoute.tls .Values.ingressRoute.tls.enabled }}
  tls:
    secretName: {{ .Values.ingressRoute.tls.secretName }}
  {{- end }}
{{- end }}