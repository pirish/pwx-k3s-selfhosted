apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "copyparty.fullname" . }}
  labels:
    {{- include "copyparty.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "copyparty.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "copyparty.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "copyparty.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}/{{ .Values.image.build }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
          - configMapRef:
              name: {{ include "copyparty.fullname" . }}-env
          {{- with .Values.extraEnvFrom }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
          {{- if or .Values.env .Values.extraEnv }}
          env:
          {{- with .Values.env }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
          {{- with .Values.extraEnv }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
          {{- end }}
          ports:
          - name: http
            containerPort: {{ .Values.service.port }}
            protocol: TCP
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}  
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- if or (and .Values.persistence .Values.persistence.config .Values.persistence.config.enabled) (and .Values.persistence .Values.persistence.config .Values.persistence.config.existingClaim) }}
            - name: config
              mountPath: /cfg/copyparty
            {{- end }}
            {{- if or (and .Values.persistence .Values.persistence.data .Values.persistence.data.enabled) (and .Values.persistence .Values.persistence.data .Values.persistence.data.existingClaim) }}
            - name: data
              mountPath: /w
            {{- end }}
            {{- if or (and .Values.configMapConfig .Values.configMapConfig.enabled) (and .Values.secretConfig .Values.secretConfig.enabled) (and .Values.config .Values.config.existingConfigMap) (and .Values.config .Values.config.existingSecret) }}
            - name: config-file
              mountPath: /cfg/copyparty.conf
              subPath: copyparty.conf
            {{- end }}
          {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
      
      volumes:
        {{- if and .Values.persistence .Values.persistence.config .Values.persistence.config.existingClaim }}
        - name: config
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.config.existingClaim }}
        {{- else if and .Values.persistence .Values.persistence.config .Values.persistence.config.enabled }}
        - name: config
          persistentVolumeClaim:
            claimName: {{ include "copyparty.fullname" . }}-config-pvc
        {{- end }}
        {{- if and .Values.persistence .Values.persistence.data .Values.persistence.data.existingClaim }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.data.existingClaim }}
        {{- else if and .Values.persistence .Values.persistence.data .Values.persistence.data.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "copyparty.fullname" . }}-data-pvc
        {{- end }}
        {{- if and .Values.config .Values.config.existingSecret }}
        - name: config-file
          secret:
            secretName: {{ .Values.config.existingSecret }}
            items:
            - key: {{ .Values.config.existingSecretKey | default "copyparty.conf" }}
              path: copyparty.conf
        {{- else if and .Values.secretConfig .Values.secretConfig.enabled }}
        - name: config-file
          secret:
            secretName: {{ include "copyparty.fullname" . }}-config-secret
            items:
            - key: copyparty.conf
              path: copyparty.conf
        {{- else if and .Values.config .Values.config.existingConfigMap }}
        - name: config-file
          configMap:
            name: {{ .Values.config.existingConfigMap }}
            items:
            - key: {{ .Values.config.existingConfigMapKey | default "copyparty.conf" }}
              path: copyparty.conf
        {{- else if and .Values.configMapConfig .Values.configMapConfig.enabled }}
        - name: config-file
          configMap:
            name: {{ include "copyparty.fullname" . }}-config
            items:
            - key: copyparty.conf
              path: copyparty.conf
        {{- end }}
      {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
