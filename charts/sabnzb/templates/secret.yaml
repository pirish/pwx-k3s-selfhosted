{{- if and .Values.secret.enabled (not .Values.secret.existingSecret) .Values.secret.data -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sabnzb.fullname" . }}-secret
  labels:
    {{- include "sabnzb.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $key, $val := .Values.secret.data }}
  {{ $key }}: {{ $val | b64enc | quote }}
  {{- end }}
{{- end }}
